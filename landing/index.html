  <style>

    html, body { height: 100%; }

    body {
      display: grid;
      place-items: center;
      min-height: 100%;
      background-image: repeating-conic-gradient(#f7d878 0% 25%, #efc04a 0% 50%);
      background-size: 12.5vw 12.5vw;
      background-position: center;
      font-family: "Hiragino Sans", "Yu Gothic", "Yu Gothic UI", "PingFang SC",
        "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    .panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .title {
      font-size: 1rem;
      letter-spacing: 0.12em;
      color: #111;
    }

    .sub-ja {
      font-size: 0.78rem;
      color: #666;
      letter-spacing: 0.08em;
    }

    .sub-en {
      font-size: 0.68rem;
      color: #aaa;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      body { background-size: 25vw 25vw; }
      .panel { padding: 32px 36px; }
    }
